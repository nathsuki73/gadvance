name: Deploy Next.js

on:
  push:
    branches:
      - main
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies locally
        run: npm ci

      # 1. Build inside GitHub's free powerful runner (NO thread/process limits)
      - name: Build Next.js App
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}

      - name: Configure SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.SSH_PORT || 65002 }}" \
            "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      # 2. Upload source + compiled standalone app to Hostinger
      - name: Upload compiled files via Rsync
        run: |
          rsync -az --delete \
            --exclude ".git" \
            --exclude ".github" \
            --exclude "node_modules" \
            --exclude ".env*" \
            -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.SSH_PORT || 65002 }}" \
            ./ "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.DEPLOY_PATH }}/"

      # 3. Copy assets into standalone & restart Passenger (NO build step on server)
      - name: Setup Standalone Server & Restart
        run: |
          ssh -i ~/.ssh/deploy_key \
            -p "${{ secrets.SSH_PORT || 65002 }}" \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" << 'EOF'
              cd ${{ secrets.DEPLOY_PATH }}
              
              # Install production-only dependencies
              npm ci --omit=dev
              
              # Ensure static assets are copied to standalone directory
              cp -r public .next/standalone/ 2>/dev/null || true
              mkdir -p .next/standalone/.next
              cp -r .next/static .next/standalone/.next/ 2>/dev/null || true
              cp -r node_modules .next/standalone/ 2>/dev/null || true
              
              # Trigger Hostinger Passenger restart
              mkdir -p tmp && touch tmp/restart.txt
          EOF
