name: Deploy Next.js to Hostinger

on:
  push:
    branches:
      - main
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Build Standalone App
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}

      - name: Configure SSH Key
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.SSH_PORT || 65002 }}" \
            "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Sync Files to Hostinger via Rsync
        run: |
          rsync -avz --checksum --delete \
            --exclude ".git" \
            --exclude ".github" \
            --exclude "node_modules" \
            --exclude ".env*" \
            -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.SSH_PORT || 65002 }}" \
            ./ "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.DEPLOY_PATH }}/"

      - name: Setup Standalone Assets & Restart Passenger
        run: |
          ssh -i ~/.ssh/deploy_key \
            -p "${{ secrets.SSH_PORT || 65002 }}" \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" << 'EOF'
              cd ${{ secrets.DEPLOY_PATH }}
              
              # Install production-only dependencies
              npm ci --omit=dev
              
              # Ensure static assets exist in BOTH root and standalone folders
              cp -r public .next/standalone/ 2>/dev/null || true
              
              mkdir -p .next/standalone/.next
              cp -r .next/static .next/standalone/.next/ 2>/dev/null || true
              
              # Ensure permissions allow web server access
              chmod -R 755 .next
              
              # Trigger Passenger process reload
              mkdir -p tmp && touch tmp/restart.txt
          EOF
