name: Build & Deploy Next.js to Hostinger

on:
  push:
    branches: ["master", "main"]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Build Next.js App
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}

      - name: Deploy Files via Rsync over SSH
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          HOST: ${{ secrets.SSH_HOST }}
          USER: ${{ secrets.SSH_USER }}
          PORT: ${{ secrets.SSH_PORT || 65002 }}
          TARGET_PATH: ${{ secrets.DEPLOY_PATH || '/home/u242590936/domains/gadvance-lspu.com/public_html' }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p $PORT $HOST >> ~/.ssh/known_hosts 2>/dev/null

          rsync -avz -e "ssh -p $PORT" \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            ./ $USER@$HOST:$TARGET_PATH/

      - name: Setup Standalone Assets & Restart Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 65002 }}
          script: |
            source ~/.profile
            cd ${{ secrets.DEPLOY_PATH || '/home/u242590936/domains/gadvance-lspu.com/public_html' }}

            # Copy static files so standalone server can find images/CSS
            cp -r public .next/standalone/ 2>/dev/null || true
            mkdir -p .next/standalone/.next
            cp -r .next/static .next/standalone/.next/ 2>/dev/null || true

            # Restart process
            mkdir -p tmp && touch tmp/restart.txt
