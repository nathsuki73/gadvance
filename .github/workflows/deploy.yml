name: Build & Deploy Next.js to Hostinger

on:
  push:
    branches: ["master", "main"]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Build Next.js App
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}

      - name: Deploy Files via Rsync over SSH
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          HOST: ${{ secrets.HOSTINGER_HOST }}
          USER: ${{ secrets.HOSTINGER_USERNAME }}
          PORT: ${{ secrets.HOSTINGER_PORT || 65002 }}
        run: |
          # 1. Configure SSH Key
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p $PORT $HOST >> ~/.ssh/known_hosts 2>/dev/null

          # 2. Sync compiled app directly into Hostinger
          rsync -avz -e "ssh -p $PORT" \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            ./ $USER@$HOST:/home/u242590936/domains/gadvance-lspu.com/public_html/

      - name: Install Production Dependencies & Restart Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.HOSTINGER_PORT || 65002 }}
          script: |
            source ~/.profile
            cd /home/u242590936/domains/gadvance-lspu.com/public_html
            npm ci --omit=dev
            mkdir -p tmp && touch tmp/restart.txt
